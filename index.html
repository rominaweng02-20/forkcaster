<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Find the Right Place for the Right Moment</title>
        <style>
            :root {
            --bg: #eef4ff;
            --card: #ffffff);
            --ink: #12302d;
            --muted: #5f7d79;
            --line: #cfe6e2;
            --accent: #0f766e;
            --good: #15803d;
            --bad: #b91c1c;
            }
	 *{ box-sizing: border-box; markgin: 0; padding:0}
            body {
            font-family: system-ui, sans-serif;
            background: var(--bg));
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem 1rem;
        }
	    #app { width: 100%;
		 max-width: 860px;
		 display: flex;
		 flex-direction:column;
		 gap: 1rem; }
	    #header { 
		padding: 1.5rem 1.5rem 1rem;
		border-bottom: 1px solid var(--line); }
	    #header h1 {
		font-size:1.6rem;
		margin-bottom: 0.5rem }
	    #header h1 span {
		color: var(--accent); }
	    #header p {
		color: var(--muted);
		margin-top:  0.95rem;
		line-height: 1.5;
		max-width: 60ch }

            #container {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
		background: var(--card);
                border: 1px solid var(--line);
		border-radius: 12px;
		align-self: flex-start;
            }
            #messages {
                overflow-y: auto;
                padding: 1.25rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                min-height: 380px;
                max-height: 65vh;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
		white-space: pre-wrap;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
		color: #fff;
		background: var(--accent);
		padding: 0.6rem 0.9rem;
		border-radius: 14px 14px 2px 14px;
            }
	    .msg.assistant {
		background: #f4efe8;
		color: var(--ink);
		padding: 0.6rem 0.9rem;
		border-radius: 14px 14px 14px 2px;
	    }
	    .msg strong { color: var(--accent); }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--ink);
                margin-bottom: 0.25rem;
            }
	    .msg.user .role { color: #fff; }
            .msg.loading .content {
                color: #999;
		font-style: italic;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1px solid var(--line);
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid var(--accent);
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-bottom-color: var(--accent);
            }
            button {
                padding: 0.75rem 1.5rem;
                background: var(--accent);
                color: #fff;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #f5f5f5;
                border-left: 3px solid #f59e0b;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #b45309;
            }
            button:disabled {
                opacity: 0.3;
            }
        </style>
    </head>
    <body>
        <div id="container">
	    <header>
		<h1> Forkcast</span></h1>
		<p> Overwhelmed with food choices around you? Tell me the occassion, your vibe, and preferred location, and I'll find you the perfect cafe, restaurant, bar or bakery for you. </p>
	    </header>

            <div id="messages"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="e.g. Closest coffee shops for studying near Columbia University"
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                div.innerHTML =
                    '<div class="role">' +
                    role +
                    '</div><div class="content">' +
                    text +
                    "</div>";
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }


            async function send() {
                const text = userInput.value.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        const div = document.createElement("div");
                        div.className = "tool";
                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = "tool call  ";
                        div.appendChild(label);
                        div.appendChild(
                            document.createTextNode(
                                call.name + "(" + JSON.stringify(call.args) + ")\n→ " + call.result,
                            ),
                        );
                        messages.insertBefore(div, loading);
                    }
                    loading.querySelector(".content").textContent =
                        data.response;
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent =
                        "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
